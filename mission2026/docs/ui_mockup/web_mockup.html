<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission 2026 — Web Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   Mission 2026 — DESKTOP WEB mockup
   NOT a stretched phone layout. Web gets:
     - persistent left sidebar (icon + label, collapsible)
     - a sticky right rail for the score + intel that is a card on phone
     - multi-column grids where phone stacks
     - master/detail split on Habits and Study
   Same design tokens as mockup.html so the two stay in sync.
   =================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0f1a; --panel:#121828; --panel-2:#182036; --panel-3:#1e2845;
  --line:#232c45; --text:#e7ecf7; --muted:#8b96b5; --faint:#5d7086;
  --accent:#22c55e; --accent-2:#3b82f6; --danger:#ef4444; --warn:#f59e0b;
  --violet:#a855f7; --radius:14px;
  --sidebar:236px; --rail:320px; --header:60px;
}
html{color-scheme:dark}
body{
  background:
    radial-gradient(1200px 500px at 80% -10%, rgba(59,130,246,.10), transparent 60%),
    radial-gradient(900px 420px at 10% 0%, rgba(34,197,94,.08), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:14px; line-height:1.4; min-height:100vh;
}

/* ==================== shell ==================== */
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr) var(--rail);min-height:100vh}
.shell.collapsed{--sidebar:64px}
.shell.no-rail{grid-template-columns:var(--sidebar) minmax(0,1fr)}

/* ---------- sidebar ---------- */
.side{
  position:sticky;top:0;height:100vh;border-right:1px solid var(--line);
  background:rgba(13,17,30,.72);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;padding:14px 10px;overflow:hidden;
}
.side .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;white-space:nowrap}
.side .brand .flame{font-size:19px;flex:none}
.side .brand .txt{font-weight:900;font-size:16px;letter-spacing:-.3px}
.side .brand .txt em{font-style:normal;background:linear-gradient(90deg,#34d399,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.collapsed .side .brand .txt{display:none}
.navbtn{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;
  color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;border:none;
  background:transparent;font-family:inherit;width:100%;text-align:left;white-space:nowrap;
  position:relative;transition:background .14s,color .14s;
}
.navbtn:hover{background:var(--panel-2);color:var(--text)}
.navbtn.on{background:var(--panel-3);color:var(--text);font-weight:700}
.navbtn.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.navbtn .nic{font-size:16px;flex:none;width:22px;text-align:center}
.navbtn .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.navbtn .badge{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--panel-3);color:var(--muted)}
.navbtn.on .badge{background:rgba(34,197,94,.18);color:#86efac}
.collapsed .navbtn .lb,.collapsed .navbtn .badge{display:none}
.collapsed .navbtn{justify-content:center;padding:9px 0}
.navsec{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint);padding:14px 11px 6px}
.collapsed .navsec{text-align:center;padding:12px 0 5px;font-size:0}
.collapsed .navsec::after{content:'···';font-size:12px}
.side .spacer{flex:1}
.side .foot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.streakbox{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;white-space:nowrap;overflow:hidden}
.collapsed .streakbox{display:none}
.streakbox .k{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
.streakbox .v{font-size:19px;font-weight:900;color:#fb923c;margin-top:2px}
.streakbox .s{font-size:10.5px;color:var(--muted);margin-top:1px}

/* ---------- main + header ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.header{
  position:sticky;top:0;z-index:20;height:var(--header);flex:none;
  display:flex;align-items:center;gap:12px;padding:0 20px;
  border-bottom:1px solid var(--line);background:rgba(11,15,26,.86);backdrop-filter:blur(10px);
}
.header h1{font-size:17px;font-weight:900;letter-spacing:-.2px}
.header .sub{font-size:12px;color:var(--muted);margin-left:2px;font-weight:500}
.header .spacer{flex:1}
/* mission countdown — the single number that frames everything else */
.countdown{
  display:flex;align-items:center;gap:10px;padding:6px 13px;border-radius:11px;
  background:linear-gradient(135deg,rgba(168,85,247,.16),rgba(59,130,246,.16));
  border:1px solid rgba(168,85,247,.35);
}
.countdown .days{font-size:22px;font-weight:900;line-height:1;color:#d8b4fe}
.countdown .lbl{display:flex;flex-direction:column;line-height:1.15}
.countdown .lbl b{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#e9d5ff}
.countdown .lbl span{font-size:10.5px;color:var(--muted)}
.ico{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;font-size:15px;cursor:pointer;color:var(--text);flex:none}
.ico:hover{background:var(--panel-3)}
.content{padding:18px 20px 40px;min-width:0}
.hidden{display:none!important}

/* ---------- right rail ---------- */
.rail{
  position:sticky;top:0;height:100vh;border-left:1px solid var(--line);
  background:rgba(13,17,30,.6);backdrop-filter:blur(10px);
  padding:16px 14px;overflow-y:auto;min-width:0;
}
.rail::-webkit-scrollbar{width:0}
.railsec{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:16px 2px 8px}
.railsec:first-child{margin-top:0}

/* ==================== shared atoms ==================== */
.card{background:linear-gradient(180deg,var(--panel),#10162a);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px}
.card+.card{margin-top:10px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 2px 9px}
.sec .t{font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.sec .a{font-size:12px;font-weight:700;color:var(--accent-2);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .06s,background .14s;white-space:nowrap}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#052e16;font-weight:700}
.btn.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#fca5a5}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2.5px 8px;border-radius:999px;background:var(--panel-3);color:var(--muted);font-weight:700;white-space:nowrap}
.pill.green{background:rgba(34,197,94,.14);color:#86efac}
.pill.blue{background:rgba(59,130,246,.15);color:#93c5fd}
.pill.amber{background:rgba(245,158,11,.15);color:#fcd34d}
.pill.rose{background:rgba(239,68,68,.14);color:#fca5a5}
.pill.violet{background:rgba(168,85,247,.15);color:#d8b4fe}
.tag{font-size:9.5px;padding:2px 6px;border-radius:999px;background:var(--panel-3);color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.bar{height:6px;border-radius:99px;background:#1d2540;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.divider{height:1px;background:var(--line);margin:10px 0}
.muted{color:var(--muted)}
.streak{color:#fb923c;font-weight:800}

/* view switcher — the SAME markup is used for a grid of columns and a 2-col grid */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start}   /* multi-column view */
.stack{display:grid;grid-template-columns:1fr;max-width:820px;gap:0}                                     /* single-column view */

/* ==================== TODAY ==================== */
.datebar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.datebar .mid{flex:1}
.datebar .d1{font-size:16px;font-weight:800}
.datebar .d2{font-size:12px;color:var(--muted);margin-top:1px}
.ring{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;background:conic-gradient(var(--ring) calc(var(--pct)*3.6deg),#1d2540 0)}
.ring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;font-size:12.5px;font-weight:900}

/* habit row — identical to phone: exactly 52px */
.habit-card{
  display:flex;align-items:center;gap:11px;padding:0 12px;margin-bottom:7px;height:52px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),#10162a);border:1px solid var(--line);border-radius:12px;
  transition:border-color .14s;
}
.habit-card:hover{border-color:#2f3a5c}
.habit-card.done{border-color:color-mix(in srgb,var(--hc) 48%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 9%,var(--panel)),#10162a)}
.h-emoji{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:16px;background:color-mix(in srgb,var(--hc) 16%,#0e1424);border:1px solid color-mix(in srgb,var(--hc) 30%,transparent)}
.h-main{flex:1;min-width:0;height:48px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.h-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-meta{color:var(--muted);font-size:11px;margin-top:1px;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.h-note{font-size:10.5px;color:#93c5fd;margin-top:2px;display:flex;gap:4px;align-items:center;min-width:0}
.h-note span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check-btn{width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer;font-family:inherit;border:2px solid color-mix(in srgb,var(--hc) 55%,var(--line));background:transparent;color:transparent;font-size:15px;font-weight:900;display:grid;place-items:center;transition:all .14s}
.check-btn:hover{background:color-mix(in srgb,var(--hc) 15%,transparent)}
.check-btn.on{background:var(--hc);border-color:var(--hc);color:#04140a}
.counter{display:flex;align-items:center;gap:5px;flex:none}
.counter .val{min-width:58px;text-align:center;font-weight:800;font-size:13px;line-height:1.15}
.counter .val small{display:block;font-size:9px;color:var(--muted);font-weight:600}
.mini-progress{height:3px;border-radius:99px;background:#1d2540;margin-top:4px;overflow:hidden}
.mini-progress i{display:block;height:100%;border-radius:99px;background:var(--hc)}

/* rail score block */
.score-hero{background:linear-gradient(180deg,var(--panel),#10162a);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.score-hero .top{display:flex;align-items:center;gap:13px}
.score-hero .big{font-size:34px;font-weight:900;line-height:1}
.score-hero .lbl{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.score-hero .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.intel-tile{background:linear-gradient(180deg,var(--panel),#10162a);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.intel-tile+.intel-tile{margin-top:8px}
.intel-tile .k{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.intel-tile .v{font-size:15px;font-weight:900;margin-top:3px}
.intel-tile .s{font-size:11px;color:var(--muted);margin-top:1px}

/* ==================== HABITS (master/detail) ==================== */
.master{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.mlist{background:linear-gradient(180deg,var(--panel),#10162a);border:1px solid var(--line);border-radius:var(--radius);padding:8px;max-height:640px;overflow-y:auto}
.mlist::-webkit-scrollbar{width:6px}
.mlist::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:99px}
.mitem{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.mitem:hover{background:var(--panel-2)}
.mitem.on{background:var(--panel-3);border-color:#2f3a5c}
.mitem .me{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--hc) 16%,#0e1424);border:1px solid color-mix(in srgb,var(--hc) 30%,transparent)}
.mitem .mn{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .ms{font-size:10.5px;color:#fb923c;font-weight:800;flex:none}
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.detail-head .dh-emoji{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--hc) 16%,#0e1424);border:1px solid color-mix(in srgb,var(--hc) 30%,transparent);flex:none}
.detail-head h2{font-size:19px;font-weight:900;letter-spacing:-.2px}
.detail-head .dh-sub{font-size:12px;color:var(--muted);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.metric{background:linear-gradient(180deg,var(--panel),#10162a);border:1px solid var(--line);border-radius:12px;padding:10px 11px;min-width:0}
.metric .k{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v{font-size:19px;font-weight:900;margin-top:3px;line-height:1.05}
.metric .s{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* grid table */
.gwrap{overflow-x:auto;padding-bottom:2px}
.hgrid{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
.hgrid th{font-size:9px;color:var(--muted);font-weight:700;text-align:center;padding:1px 0}
.hgrid th .dl{display:block;font-size:8.5px;opacity:.75}
.hgrid th.now{color:var(--accent)}
.hgrid .name-cell{position:sticky;left:0;z-index:5;background:#10162a;padding:5px 10px 5px 5px;border-radius:9px;text-align:left}
.name-inner{display:flex;align-items:center;gap:6px}
.name-inner .ne{font-size:14px}
.name-inner .nt{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{width:100%;aspect-ratio:1;border-radius:5px;background:#151c30;border:1px solid #1d2540;cursor:pointer;display:block;transition:transform .05s}
.cell:hover{transform:scale(1.16);border-color:#3a4a7a;position:relative;z-index:2}
.cell.done{background:var(--hc);border-color:var(--hc)}
.cell.part{background:color-mix(in srgb,var(--hc) 45%,#151c30)}
.cell.rest{background:transparent;border:1px dashed #232c45}
.cell.today-outline{outline:2px solid rgba(255,255,255,.5);outline-offset:1px}
.grid-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:11px;align-items:center}
.grid-legend i{width:11px;height:11px;border-radius:3.5px;display:inline-block;vertical-align:-1.5px;margin-right:5px}

/* ==================== STUDY ==================== */
.astrip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;gap:1px;margin-bottom:14px}
.astrip .a{background:var(--panel);padding:11px 9px;text-align:center;min-width:0}
.astrip .a .av{font-size:18px;font-weight:900;line-height:1.05}
.astrip .a .al{font-size:9px;color:var(--faint);margin-top:3px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.tabs{display:inline-flex;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px}
.tabs button{padding:6px 14px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--panel-3);color:var(--text)}
.tabs .cnt{font-size:10px;opacity:.75;font-weight:800;margin-left:4px}
.dtable{background:linear-gradient(180deg,var(--panel),#10162a);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.drow{display:grid;grid-template-columns:56px minmax(0,1.6fr) minmax(0,1fr) 120px 200px;gap:14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:none}
.drow:hover{background:rgba(30,40,69,.35)}
.drow.head{background:var(--panel-2);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);padding:9px 14px}
.drow .dname{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .dsub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .dacts{display:flex;gap:6px;justify-content:flex-end}
.drow .prog{min-width:0}

/* ==================== FITNESS ==================== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.hero{background:linear-gradient(135deg,#38bdf8,#3b82f6);border-radius:var(--radius);padding:16px 17px;color:#fff}
.hero .hk{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.hero .hv{font-size:34px;font-weight:900;line-height:1.05;margin-top:4px}
.hero .hv small{font-size:13px;font-weight:600;opacity:.85}
.hero .hrow{display:flex;gap:18px;margin-top:13px}
.hero .hrow b{display:block;font-size:16px;font-weight:900}
.hero .hrow span{font-size:10.5px;opacity:.85}
.exrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}
.exrow:last-child{border-bottom:none}
.exrow .exn{font-weight:700;font-size:13px;flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.exrow .sets{font-size:11.5px;color:var(--muted);margin-top:2px}
.volume{font-size:12px;color:var(--muted);margin-top:10px}
.volume b{color:var(--text)}
.field-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mini-field{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:0}
.mini-field .mfk{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.mini-field .mfv{font-size:16px;font-weight:800;margin-top:2px}

/* ==================== GOALS ==================== */
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.goal{background:linear-gradient(180deg,var(--panel),#10162a);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;position:relative}
.goal .gt{font-weight:800;font-size:14.5px;padding-right:64px;line-height:1.2}
.goal .gn{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gtrack{height:8px;background:#171f36;border-radius:99px;overflow:hidden;margin-top:10px}
.gtrack i{display:block;height:100%;border-radius:99px}
.gfoot{display:flex;align-items:center;margin-top:8px;font-size:11px;color:var(--muted);gap:8px;flex-wrap:wrap}
.gpct{font-weight:900;font-size:13px}
.gmenu{position:absolute;top:11px;right:11px;display:flex;gap:5px}
.gmenu .ico{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;font-size:12px;cursor:pointer;color:var(--muted)}
.gmenu .ico:hover{color:var(--text);background:var(--panel-3)}
.pace-note{font-size:11px;color:#93c5fd;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:9px;padding:7px 10px;margin-top:9px;line-height:1.4}
.timeline{display:flex;align-items:center;gap:7px;margin-top:9px}
.timeline .tl{flex:1;height:5px;border-radius:99px;background:#171f36;position:relative;overflow:hidden}
.timeline .tl i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}

function viewFood(){

  const remaining=CAL_GOAL-tot.kcal;
  const pctUsed=Math.min(100,Math.round(tot.kcal/CAL_GOAL*100));
  const over=remaining<0;
  const ringColor=over?'#ef4444':pctUsed>85?'#f59e0b':'#22c55e';

  // donut geometry
  const R=62, CIRC=2*Math.PI*R;
  const dash=CIRC*(pctUsed/100);

  const mealIcon={Breakfast:'🌅',Lunch:'🍛',Dinner:'🌙',Snack:'🍎'};
  const meals=ALL_MEALS.map(meal=>{
    const items=DIARY.filter(r=>r.meal===meal);

    return `<div class="mealcard">
      <div class="mealhead">
        <span class="mico">${mealIcon[meal]}</span>
        <span class="mtitle">${meal}</span>
        <span class="mkcal">${mk} <small>kcal</small></span>

            stroke-linecap="round" stroke-dasharray="${dash} ${CIRC}" style="transition:stroke-dasharray .5s"/>
        </svg>
        <div class="center">
          <div class="rem" style="color:${ringColor}">${Math.abs(remaining)}</div>
          <div class="lbl">${over?'over':'remaining'}</div>
          <div class="of">of ${CAL_GOAL} kcal</div>
        </div>
      </div>
      <div class="macros">

        ${macro('Fat',tot.f,MACRO_GOAL.f,'#a855f7')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:13px;border-top:1px solid var(--line);padding-top:11px">

    <div>

        <div class="foodsearch">🔍 Search a dish… <span style="color:var(--faint);font-size:11px">e.g. "roti", "paneer", "dosa"</span></div>

/* ===================== NOTES ===================== */
function viewNotes(){
  const tag=S.noteTag||'all';
  const filtered=tag==='all'?NOTES_FEED:NOTES_FEED.filter(n=>n.tag===tag);
  const counts={all:NOTES_FEED.length};
  NOTES_FEED.forEach(n=>counts[n.tag]=(counts[n.tag]||0)+1);

  // group by date, newest first
  const byDate={};
  filtered.forEach(n=>{ (byDate[n.date]=byDate[n.date]||[]).push(n); });
  const dates=Object.keys(byDate).sort().reverse();

  const dayLabel=ds=>{
    const d=new Date(ds+'T00:00:00');
    const diff=Math.round((today-d)/86400000);
    if(diff===0)return 'Today';
    if(diff===1)return 'Yesterday';
    return DAY_N[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];
  };

  const groups=dates.map(ds=>`
    <div class="notegroup">
      <div class="ngday">
        <span class="nd">${dayLabel(ds)}</span>
        <span class="nn">${ds} · ${byDate[ds].length} note${byDate[ds].length>1?'s':''}</span>
        <span class="nline"></span>
      </div>
      ${byDate[ds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(n=>`
        <div class="note ${n.pinned?'pinned':''}">
          <div class="nbody">
            <div class="nhead">
              <span class="pill ${NOTE_TAG_COLOR[n.tag]}">${NOTE_TAGS[n.tag]}</span>
              <span class="nref">${n.ref}</span>
              ${n.pinned?'<span class="pill amber">📌 pinned</span>':''}
            </div>
            <div class="ntext">${n.text}</div>
          </div>
          <div class="nacts">
            <span class="ico" style="width:26px;height:26px;font-size:12px" title="Pin">📌</span>
            <span class="ico" style="width:26px;height:26px;font-size:12px" title="Edit">✏️</span>
            <span class="ico" style="width:26px;height:26px;font-size:12px" title="Delete (soft)">🗑</span>
          </div>
        </div>`).join('')}
    </div>`).join('');

  const chip=(k,label)=>`<button class="chip ${tag===k?'on':''}" onclick="S.noteTag='${k}';render()">${label}<span class="cc">${counts[k]||0}</span></button>`;

  return `<div class="notesbar">
      <div class="chips">
        ${chip('all','All')}${chip('day','Day')}${chip('habit','Habits')}${chip('fitness','Fitness')}${chip('food','Food')}${chip('goal','Goals')}${chip('idea','Ideas')}
      </div>
      <span style="flex:1"></span>
      <select class="btn sm"><option>Newest first</option><option>Oldest first</option><option>Only pinned</option></select>
      <button class="btn sm">⬇ Export</button>
      <button class="btn sm primary">＋ New note</button>
    </div>
    <div class="notelist">
      ${tag==='all'?`<div class="card" style="margin-bottom:16px;border-color:rgba(245,158,11,.4);background:linear-gradient(180deg,rgba(245,158,11,.06),#10162a)">
        <div style="display:flex;gap:11px;align-items:flex-start">
          <span style="font-size:17px">📌</span>
          <div><div style="font-size:12.5px;font-weight:800;margin-bottom:3px">Pinned</div>
          <div style="font-size:12.5px;line-height:1.5;color:#cdd7ea">${NOTES_FEED.find(n=>n.pinned).text}</div></div>
        </div>
      </div>`:''}
      ${groups || '<div class="card" style="text-align:center;color:var(--muted)">No notes in this filter yet.</div>'}
    </div>`;
}

/* ===================== RAIL (web-only) ===================== */
function renderRail(){
  const st=dayStats(), remaining=st.due-st.done;
  if(S.tab==='vision'||S.tab==='settings'){ document.getElementById('rail').innerHTML=''; document.getElementById('shell').classList.add('no-rail'); return; }
  document.getElementById('shell').classList.remove('no-rail');
  const ringColor=st.pct===100?'#22c55e':st.pct>=50?'#3b82f6':'#f59e0b';
  const rail=document.getElementById('rail');

  /* Food tab gets a nutrition rail instead of the habit score */
  if(S.tab==='food'){
    const tot=DIARY.reduce((a,r)=>({kcal:a.kcal+r.kcal,p:a.p+r.p,c:a.c+r.c,f:a.f+r.f}),{kcal:0,p:0,c:0,f:0});
    const rem=CAL_GOAL-tot.kcal, over=rem<0;
    rail.innerHTML=`
      <div class="score-hero">
        <div class="lbl">Calories today</div>
        <div class="big" style="color:${over?'#ef4444':'#22c55e'}">${Math.abs(rem)}</div>
        <div class="sub">${over?'over goal':'remaining'} of ${CAL_GOAL} kcal</div>
        <div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,Math.round(tot.kcal/CAL_GOAL*100))}%;background:${over?'#ef4444':'#22c55e'}"></i></div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:7px">${tot.kcal} eaten · ${DIARY.length} items</div>
      </div>
      <div class="railsec">Macros</div>
      ${[['Protein',tot.p,MACRO_GOAL.p,'#3b82f6'],['Carbs',tot.c,MACRO_GOAL.c,'#f59e0b'],['Fat',tot.f,MACRO_GOAL.f,'#a855f7']]
        .map(([l,v,g,c])=>`<div class="hs-row" style="margin-bottom:9px">
          <div class="hn" style="width:64px">${l}</div>
          <div class="hs-track"><i style="width:${Math.min(100,Math.round(v/g*100))}%;background:${c}"></i></div>
          <div class="hp">${Math.round(v)}<span style="color:var(--faint);font-weight:600">/${g}g</span></div>
        </div>`).join('')}
      <div class="railsec">Recently logged</div>
      ${DIARY.slice(-3).reverse().map(r=>`<div class="intel-tile"><div class="k">${r.meal}</div><div class="v" style="font-size:13px">${r.food}</div><div class="s">${r.kcal} kcal</div></div>`).join('')}`;
    return;
  }

  /* Notes tab gets a notes rail */
  if(S.tab==='notes'){
    const counts={}; NOTES_FEED.forEach(n=>counts[n.tag]=(counts[n.tag]||0)+1);
    rail.innerHTML=`
      <div class="score-hero">
        <div class="lbl">Total notes</div>
        <div class="big">${NOTES_FEED.length}</div>
        <div class="sub">across ${Object.keys(counts).length} categories</div>
      </div>
      <div class="railsec">By category</div>
      ${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="intel-tile">
        <div class="k">${NOTE_TAGS[k]}</div><div class="v">${v}</div></div>`).join('')}
      <div class="railsec">Pinned</div>
      <div class="intel-tile"><div class="k">📌 Today</div><div class="s" style="margin-top:5px;line-height:1.45">${NOTES_FEED.find(n=>n.pinned).text.slice(0,90)}…</div></div>`;
    return;
  }

  /* Fitness gets a muscle-coverage rail */
  if(S.tab==='fitness'){
    const cover={}; MODULES.forEach(m=>moduleMuscles(m).forEach(([mu,s])=>{cover[mu]=(cover[mu]||0)+s;}));
    const maxC=Math.max(...Object.values(cover),1);
    rail.innerHTML=`
      <div class="score-hero">
        <div class="lbl">Weekly volume</div>
        <div class="big">${MODULES.reduce((v,m)=>v+m.exercises.reduce((a,e)=>a+(e.cardio?0:e.sets*e.reps*e.kg),0),0).toLocaleString('en-IN')}<span style="font-size:14px;color:var(--muted)"> kg</span></div>
        <div class="sub">${MODULES.reduce((n,m)=>n+m.exercises.length,0)} exercises · 4 modules</div>
      </div>
      <div class="railsec">Muscle coverage / week</div>
      ${Object.entries(cover).sort((a,b)=>b[1]-a[1]).map(([mu,s])=>`<div class="hs-row" style="margin-bottom:8px">
        <div class="hn" style="width:80px">${mu}</div>
        <div class="hs-track"><i style="width:${Math.round(s/maxC*100)}%;background:#3b82f6"></i></div>
        <div class="hs" style="width:44px;color:var(--muted)">${s? s+' sets':'—'}</div>
      </div>`).join('')}
      <div class="railsec">Today</div>
      <div class="intel-tile"><div class="k">Scheduled</div><div class="v" style="font-size:14px">${MODULES.find(m=>m.days.includes(['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][today.getDay()]))?.name||'Rest'}</div><div class="s">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][today.getDay()]}</div></div>`;
    return;
  }

  rail.innerHTML = `
    <div class="score-hero">
      <div class="top">
        <div class="ring" style="--pct:${st.pct};--ring:${ringColor};width:64px;height:64px"><span style="font-size:15px">${st.pct}%</span></div>
        <div style="min-width:0">
          <div class="lbl">Day score</div>
          <div class="big">${st.done}<span style="font-size:17px;color:var(--muted)">/${st.due}</span></div>
          <div class="sub">${remaining>0?remaining+' to go':'🎉 perfect day'}</div>
        </div>
      </div>
      <div class="bar" style="margin-top:12px"><i style="width:${st.pct}%;background:${ringColor}"></i></div>
    </div>
    <div class="railsec">Needs attention</div>
    <div class="intel-tile"><div class="k">🔥 Streak at risk</div><div class="v" style="color:#fb923c">14 days</div><div class="s">Wake 4 AM · not done yet</div></div>
    <div class="intel-tile"><div class="k">🎯 Focus next</div><div class="v" style="color:#93c5fd">Gym + 20K Steps</div><div class="s">lowest momentum at 41%</div></div>
    <div class="intel-tile"><div class="k">🫀 Burnout load</div><div class="v" style="color:#86efac">Healthy</div><div class="s">recovery 62% · no over-training</div></div>
    <div class="railsec">Quick log</div>
    <div style="display:flex;gap:7px">
      <button class="btn sm" style="flex:1" onclick="alert('Open the study log')">📚 Study</button>
      <button class="btn sm" style="flex:1" onclick="alert('Open the workout sheet')">🏋️ Gym</button>
    </div>
    <div class="railsec">Top streaks</div>
    ${[6,7,1].map(id=>{const h=HABITS.find(x=>x.id===id);return `<div class="hs-row" style="margin-bottom:7px">
      <div class="he">${h.emoji}</div><div class="hn">${h.name}</div>
      <div class="hs-track"><i style="width:${pct30[id]}%;background:${h.color}"></i></div>
      <div class="hs">🔥 ${streaks[id]}</div></div>`;}).join('')}`;
}

/* ===================== SHELL ===================== */
const TABS=[
  {id:'today',icon:'✅',label:'Today',badge:'',sub:'Sunday, 20 October 2026',render:viewToday,add:'Log habit'},
  {id:'habits',icon:'▦',label:'Habits',badge:'10',sub:'10 active · 1 paused',render:viewHabits,add:'New habit'},
  {id:'study',icon:'📚',label:'Study',badge:'UPSC',sub:'UPSC CSE 2027 · 53 resources',render:viewStudy,add:'Add resource'},
  {id:'fitness',icon:'🏋️',label:'Fitness',badge:'',sub:'Push · Pull · Legs · Cardio split',render:viewFitness,add:'Log workout'},
  {id:'food',icon:'🍛',label:'Food',badge:String(DIARY.length),sub:`${FOODS.length} dishes · ${CAL_GOAL} kcal goal`,render:viewFood,add:'Log food'},
  {id:'goals',icon:'🎯',label:'Goals',badge:'5',sub:'13 objectives · 5 active',render:viewGoals,add:'New goal'},
  {id:'notes',icon:'📝',label:'Notes',badge:String(NOTES_FEED.length),sub:'Every note, grouped by day',render:viewNotes,add:'New note'},
  {id:'stats',icon:'📊',label:'Stats',badge:'',sub:'Consistency and records',render:viewStats,add:''},
  {id:'vision',icon:'✨',label:'Vision',badge:'',sub:'Why this year matters',render:viewVision,add:''},
];
const NAV_GROUPS=[
  {title:'',ids:['today','habits','study','fitness','food']},
  {title:'Direction',ids:['goals','notes']},
  {title:'Insight',ids:['stats','vision']},
];

function renderNav(){
  document.getElementById('nav').innerHTML = NAV_GROUPS.map(g=>
    (g.title?`<div class="navsec">${g.title}</div>`:'')
    + g.ids.map(id=>TABS.find(t=>t.id===id)).filter(Boolean).map(t=>
      `<button class="navbtn ${S.tab===t.id?'on':''}" onclick="go('${t.id}')" title="${t.label}">
        <span class="nic">${t.icon}</span><span class="lb">${t.label}</span>${t.badge?`<span class="badge">${t.badge}</span>`:''}
      </button>`).join('')
  ).join('')
  + `<div class="navsec">System</div>`
  + `<button class="navbtn ${S.tab==='settings'?'on':''}" onclick="go('settings')" title="Settings">
      <span class="nic">⚙️</span><span class="lb">Settings</span>
    </button>`;
}

function render(){
  const t=TABS.find(x=>x.id===S.tab) || {id:'settings',label:'Settings',sub:'Control the whole system',add:''};
  document.getElementById('view').innerHTML=(t.render||viewSettings)();
  document.getElementById('pageTitle').textContent=t.label;
  document.getElementById('pageSub').textContent=t.sub;
  document.getElementById('addBtn').style.display=t.add?'':'none';
  document.getElementById('addBtn').textContent='＋ '+(t.add||'');
  renderNav(); renderRail();
}
function go(t){S.tab=t;render();}
function toggle(id){S.done[id]=S.done[id]?0:1;render();}
function bump(id,d){S.counts[id]=Math.max(0,(S.counts[id]||0)+d);render();}
function shiftDate(d){const x=addDays(new Date(S.date+'T00:00:00'),d);if(x>today)return;S.date=iso(x);render();}
function cellToggle(id){S.done[id]=S.done[id]?0:1;render();}
function move(track){S.studyTab=track;render();}
function bumpStudy(d){alert('Study hours: '+(4.5+d));}
document.getElementById('collapse').onclick=()=>document.getElementById('shell').classList.toggle('collapsed');

render();
</script>
</body>
</html>
