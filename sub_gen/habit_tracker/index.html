<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Momentum — Habit Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">🔥 <span>Momentum</span></div>
  <div class="topbar-actions">
    <button class="btn ghost small" data-action="export" title="Backup all data">⬇ Export</button>
    <button class="btn ghost small" data-action="import" title="Restore from backup">⬆ Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>

<main id="main">
  <section id="view-today" class="view active"></section>
  <section id="view-habits"  class="view"></section>
  <section id="view-stats"   class="view"></section>
  <section id="view-workouts" class="view"></section>
  <section id="view-goals"   class="view"></section>
</main>

<nav class="bottomnav">
  <button data-action="nav" data-tab="today" class="active"><span class="nav-ico">✅</span>Today</button>
  <button data-action="nav" data-tab="habits"><span class="nav-ico">▦</span>Habits</button>
  <button data-action="nav" data-tab="stats"><span class="nav-ico">📊</span>Stats</button>
  <button data-action="nav" data-tab="workouts"><span class="nav-ico">🏋️</span>Workout</button>
  <button data-action="nav" data-tab="goals"><span class="nav-ico">🎯</span>Goals</button>
</nav>

<!-- Generic modal (habit / goal forms) -->
<div id="modalOverlay" class="overlay">
  <div class="modal">
    <button class="modal-close" data-action="close-modal" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Workout session sheet -->
<div id="wsOverlay" class="overlay sheet-overlay">
  <div id="wsSheet" class="ws-sheet"></div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
